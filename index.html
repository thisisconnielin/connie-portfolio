// sticker + a soft contact shadow on the ground

let prev = performance.now();
function tick(now) {

const note = document.getElementById("note");
let noteX = -40, noteHold = false;
note.addEventListener("pointerenter", () => (noteHold = true)); note.addEventListener("pointerleave", () => (noteHold = false));
note.addEventListener("touchstart", () => { noteHold = true; clearTimeout(note.t); note.t = setTimeout(() => (noteHold = false), 4000); }, { passive: true });
function flyNote(dt, t) {
  const w = note.offsetWidth, mob = W <= 720;
  if (!noteHold) noteX += (mob ? 22 : 30) * dt;
  if (noteX > W + 20) noteX = -w - 20;
  const y = H * (mob ? .44 : .36) + Math.sin(t * .9) * 12 + Math.sin(t * 2.3) * 3;
  note.style.transform = `translate(${noteX}px, ${y}px) rotate(${Math.sin(t * .8) * 3}deg)`;

bubble.onclick = () => near >= 0 && openCard(LANDMARKS[near].id);
function openCard(id) { const c = CARDS[id]; card.innerHTML = `<span class="x" onclick="closeCard()">×</span><div class="k">${c.k}</div><h2>${c.t}</h2>${c.p ? `<p>${c.p}</p>` : ""}${c.h}`; card.classList.add("show"); hint.style.opacity = 0; }
// films play right inside the card
function playFilm(f) {
  const p = document.getElementById("player");
  p.innerHTML = `<video src="${MEDIA}${f}.mp4" poster="${MEDIA}${f}.jpg" controls autoplay playsinline></video>`;
  p.scrollIntoView({ block: "nearest", behavior: "smooth" });
}
function closeCard() { card.querySelectorAll("video").forEach((v) => v.pause()); card.classList.remove("show"); }
function tag(it, x, y) {
  document.querySelectorAll(".tag").forEach((e) => e.remove());
  const e = document.createElement("div"); e.className = "tag glass"; e.innerHTML = `<b>i love ${it.label}</b><span>${it.line}</span>`;
  e.style.left = Math.max(140, Math.min(W - 140, x)) + "px"; e.style.top = Math.max(150, y) + "px"; document.body.append(e); setTimeout(() => e.remove(), 3400);

function tap(px, py) {

let downX = 0, downY = 0;
cv.addEventListener("pointerdown", (e) => { dragging = true; moved = 0; downX = lastX = e.clientX; downY = e.clientY; lastT = performance.now(); dragV = 0; cv.classList.add("drag"); cv.setPointerCapture(e.pointerId); });
cv.addEventListener("pointermove", (e) => {

addEventListener("keydown", (e) => {

addEventListener("wheel", (e) => { const d = -(e.deltaX || e.deltaY) * .045; theta += d; if (d) dir = Math.sign(d); }, { passive: true });
addEventListener("resize", build);

// load Codex's assets; anything missing falls back to a placeholder so the page always works
(async () => {
